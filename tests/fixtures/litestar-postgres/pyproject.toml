[project]
name = "litestar-postgres-fixture"
version = "0.1.0"
description = "A small notes API: Litestar over a Postgres data-access layer."
requires-python = ">=3.15"
dependencies = [
  "litestar==2.25.0",
  "psycopg[binary]==3.3.8",
  "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
  "pytest==9.2.0",
  "ruff==0.17.4",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
